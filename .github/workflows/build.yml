name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t my-buildozer-image .

      - name: Run Buildozer
        run: |
          # Флаг --user убран, entrypoint.sh сам переключит пользователя
          docker run --rm -v "$PWD":/home/user/hostcwd my-buildozer-image -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Case-Simulator-APK
          path: bin/*.apk
